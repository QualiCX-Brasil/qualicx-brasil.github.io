          js = '<script>document.querySelectorAll(".filters button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".filters button").forEach(x=>x.classList.toggle("on",x===b));const f=b.dataset.f;document.querySelectorAll(".ncard").forEach(c=>c.style.display=!f||c.dataset.cat===f?"":"none")})</script>'
          pagina('noticias.html', 'Notícias da semana: CX, SAC e Contact Center',
                 'Curadoria semanal de manchetes sobre experiência do cliente, SAC e Contact Center no Brasil.',
