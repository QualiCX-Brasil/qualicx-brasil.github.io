name: Revista QualiCX Brasil
on:
  push:
    paths: ['.github/workflows/revista.yml']
  schedule:
    - cron: '0 11 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  revista:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ferramentas da revista
        run: |
          mkdir -p $(dirname tools/noticias.py)
          cat > tools/noticias.py <<'QCXEOF'
          # Curadoria semanal de manchetes de CX e Contact Center (somente titulo, veiculo, data e link).
          import urllib.request, urllib.parse, xml.etree.ElementTree as ET, json, html, datetime, email.utils, pathlib, re
          BASE = pathlib.Path('.')
          Q = ['"contact center" OR "call center"',
               '"experiência do cliente" OR "customer experience" OR "customer success"',
               'SAC atendimento consumidor Senacon OR Procon OR "Reclame Aqui"']
          FEEDS = [('Consumidor Moderno', 'https://consumidormoderno.com.br/feed/')]
          for q in Q:
              FEEDS.append(('Google Notícias', 'https://news.google.com/rss/search?' + urllib.parse.urlencode({'q': q + ' when:7d', 'hl': 'pt-BR', 'gl': 'BR', 'ceid': 'BR:pt-419'})))
          UA = {'User-Agent': 'QualiCX-Brasil-curadoria/1.0 (+https://qualicx-brasil.github.io/)'}
          KEY = re.compile(r'(atendimento|cliente|consumidor|CX|contact center|call center|SAC|experiência|customer|ouvidoria|NPS|chatbot|omnichannel)', re.I)
          RUIDO = re.compile(r'(gasolina|combust|diesel|DNA|paternidade|vacina|eleiç|futebol|loteria|preço d[aoe]s? |vaga|emprego|salário|contrata|concurso|currículo)', re.I)
          now = datetime.datetime.now(datetime.timezone.utc)
          items, seen = [], set()
          for nome, url in FEEDS:
              try:
                  data = urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=30).read()
                  root = ET.fromstring(data)
              except Exception as e:
                  print('falhou', nome, e); continue
              for it in root.iter('item'):
                  t = (it.findtext('title') or '').strip(); l = (it.findtext('link') or '').strip()
                  src = (it.findtext('source') or nome).strip()
                  if nome == 'Google Notícias' and ' - ' in t and src != nome:
                      t = t.rsplit(' - ', 1)[0]
                  try: d = email.utils.parsedate_to_datetime(it.findtext('pubDate'))
                  except Exception: d = now
                  if d.tzinfo is None: d = d.replace(tzinfo=datetime.timezone.utc)
                  if (now - d).days > 10 or not t or not l: continue
                  if not KEY.search(t) or RUIDO.search(t) or src.lower() in ('instagram','facebook','youtube','tiktok'): continue
                  k = re.sub(r'\W+', '', t.lower())[:80]
                  if k in seen: continue
                  seen.add(k); items.append({'titulo': t, 'fonte': src, 'data': d.strftime('%Y-%m-%d'), 'link': l})
          items.sort(key=lambda x: x['data'], reverse=True); items = items[:40]
          (BASE/'data').mkdir(exist_ok=True)
          (BASE/'data'/'noticias.json').write_text(json.dumps({'atualizado': now.strftime('%Y-%m-%d'), 'itens': items}, ensure_ascii=False, indent=1))
          print('noticias:', len(items))
          QCXEOF
          mkdir -p $(dirname tools/revista.py)
          cat > tools/revista.py <<'QCXEOF'
          # QualiCX Brasil - gerador das paginas da revista (executado pelo GitHub Actions).
          # Artes das noticias: ilustracoes abstratas geradas aqui (SVG proprio), sem usar imagens dos veiculos.
          import json, html, re, pathlib, datetime, hashlib, random
          B = pathlib.Path('.')
          SITE = 'https://qualicx-brasil.github.io/'
          REPO = 'https://github.com/QualiCX-Brasil/qualicx-brasil.github.io'
          EMAIL_EDITORIAL = ''   # preencher quando a caixa editorial dedicada existir
          HOJE = datetime.date.today()
          E = html.escape

          # ---------------- Estilo ----------------
          CSS = """
          :root{--bg:#07090d;--bg2:#0d1118;--card:#111722;--card2:#161e2c;--line:#222c3b;--fg:#e8edf4;--muted:#93a1b5;--accent:#8b5cf6;--accent2:#22d3ee;--warm:#f59e0b;--serif:'Fraunces',Georgia,serif;--sans:'Inter',system-ui,sans-serif}
          *{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
          body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 var(--sans)}
          a{color:inherit;text-decoration:none}
          p a{color:var(--accent2);text-decoration:underline;text-underline-offset:3px}
          img,svg{display:block;max-width:100%}
          .wrap{max-width:1180px;margin:0 auto;padding:0 20px}
          .narrow{max-width:820px}
          .masthead{padding:34px 0 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
          .masthead .brand{font:800 clamp(2.4rem,7vw,4rem)/1 var(--serif);letter-spacing:-.02em;margin-top:8px}
          .masthead .brand span{color:var(--accent)}
          .masthead .tagline{color:var(--muted);font-size:.95rem;max-width:420px;margin:0}
          .edition{font:600 .74rem var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
          .kicker{display:inline-block;font:700 .72rem var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
          h1,h2,h3{font-family:var(--serif);letter-spacing:-.01em;line-height:1.15}
          h1{font-size:clamp(2rem,5vw,3.1rem);margin:.3em 0 .4em}
          h2.sec{font-size:1.6rem;margin:56px 0 18px;display:flex;align-items:center;gap:14px}
          h2.sec:after{content:"";flex:1;height:1px;background:var(--line);order:1}
          h2.sec a{font:600 .85rem var(--sans);color:var(--accent2);order:2;white-space:nowrap}
          .lead{font-size:1.15rem;color:#c8d1de;max-width:720px}
          .meta{color:var(--muted);font-size:.88rem}
          .chip{display:inline-block;font:700 .66rem var(--sans);letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);color:#fff;border:1px solid rgba(255,255,255,.2)}
          .featured{display:grid;grid-template-columns:1.5fr 1fr;gap:22px;margin-top:28px}
          .feat-main{position:relative;border-radius:18px;overflow:hidden;min-height:440px;display:flex;align-items:flex-end;border:1px solid var(--line);transition:border-color .2s}
          .feat-main .art{position:absolute;inset:0}.feat-main .art svg{width:100%;height:100%}
          .feat-main .ov{position:relative;padding:28px;background:linear-gradient(180deg,rgba(7,9,13,0) 0%,rgba(7,9,13,.8) 40%,rgba(7,9,13,.96) 100%);width:100%}
          .feat-main h3{font-size:clamp(1.5rem,3vw,2.2rem);margin:12px 0 8px}
          .feat-side{display:flex;flex-direction:column;gap:12px}
          .mini{display:grid;grid-template-columns:118px 1fr;gap:14px;align-items:center;padding:10px;border-radius:14px;background:var(--card);border:1px solid var(--line);transition:border-color .2s}
          .mini:hover,.ncard:hover,.feat-main:hover,.arow:hover{border-color:var(--accent)}
          .mini .art{border-radius:10px;overflow:hidden;aspect-ratio:4/3}.mini .art svg{width:100%;height:100%}
          .mini h4{margin:4px 0;font:600 .95rem/1.35 var(--sans)}
          .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
          .ncard{display:flex;flex-direction:column;border-radius:16px;overflow:hidden;background:var(--card);border:1px solid var(--line);transition:border-color .2s,transform .2s}
          .ncard:hover{transform:translateY(-3px)}
          .ncard .art{position:relative;aspect-ratio:16/9}.ncard .art svg{width:100%;height:100%}
          .ncard .art .chip{position:absolute;left:12px;top:12px}
          .ncard .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
          .ncard h3{font:600 1.03rem/1.4 var(--sans);margin:0}
          .ncard .meta{margin-top:auto}
          .filters{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 26px}
          .filters button{font:600 .82rem var(--sans);padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
          .filters button.on{background:var(--accent);border-color:var(--accent)}
          .band{margin-top:56px;border-radius:22px;overflow:hidden;display:grid;grid-template-columns:1fr 1.1fr;background:var(--card);border:1px solid var(--line)}
          .band .art svg{width:100%;height:100%;min-height:280px}
          .band .txt{padding:34px;align-self:center}
          .band h3{font-size:1.9rem;margin:8px 0 12px}
          .btn{display:inline-block;background:var(--accent);color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;margin-top:10px;text-decoration:none!important}
          .alist{display:grid;gap:14px}
          .arow{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line);transition:border-color .2s}
          .arow .art{border-radius:12px;overflow:hidden;aspect-ratio:4/3}.arow .art svg{width:100%;height:100%}
          .arow h3{font-size:1.2rem;margin:4px 0 6px}
          .quote{font:500 clamp(1.4rem,3vw,2rem)/1.3 var(--serif);border-left:4px solid var(--accent);padding:6px 0 6px 22px;margin:48px 0}
          .quote small{display:block;font:500 .9rem var(--sans);color:var(--muted);margin-top:8px}
          .cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
          .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
          .box h3{margin:0 0 8px;font-size:1.2rem}.box p{margin:0}
          .steps{counter-reset:s;display:grid;gap:12px;padding:0;list-style:none}
          .steps li{counter-increment:s;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px 16px 66px;position:relative}
          .steps li:before{content:counter(s,decimal-leading-zero);position:absolute;left:18px;top:13px;font:800 1.3rem var(--serif);color:var(--accent)}
          .hero-art{border-radius:20px;overflow:hidden;border:1px solid var(--line);margin:24px 0 10px}.hero-art svg{width:100%;height:auto}
          footer{margin-top:80px;border-top:1px solid var(--line);padding:36px 0 50px;color:var(--muted);font-size:.9rem}
          footer .brand{font:800 1.5rem var(--serif);color:var(--fg)}footer .brand span{color:var(--accent)}
          footer nav{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0}footer nav a{color:var(--fg)}
          @media(max-width:860px){.featured,.band{grid-template-columns:1fr!important}.feat-main{min-height:360px}.band .art{order:-1}.band .art svg{min-height:180px}.arow{grid-template-columns:96px 1fr}.mini{grid-template-columns:96px 1fr}.band .txt{padding:24px}}
          """
          FONTS = '<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 64 64\'%3E%3Crect width=\'64\' height=\'64\' rx=\'14\' fill=\'%2307101d\'/%3E%3Ctext x=\'32\' y=\'44\' font-family=\'Georgia,serif\' font-size=\'38\' font-weight=\'700\' text-anchor=\'middle\' fill=\'%2338bdf8\'%3EQ%3C/text%3E%3C/svg%3E"><link rel="alternate" type="application/rss+xml" title="QualiCX Brasil" href="https://qualicx-brasil.github.io/feed.xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">'
          (B/'assets').mkdir(exist_ok=True)
          (B/'assets'/'qcx.css').write_text(CSS.strip() + '\n')

          LINKS = [('', 'Início'), ('noticias.html', 'Notícias'), ('artigos.html', 'Artigos'), ('boas-praticas.html', 'Boas práticas'),
                   ('frases.html', 'Frases'), ('publique.html', 'Publique'), ('autor.html', 'Sobre')]

          def nav(prefix=''):
              home = prefix or './'
              a = ''.join(f'<a href="{prefix + h}" style="color:#c9d3e0;text-decoration:none;white-space:nowrap;padding:6px 10px;border-radius:8px">{t}</a>' for h, t in LINKS[1:])
              return ('<!--qcx-nav--><nav aria-label="Seções da revista" style="position:sticky;top:0;z-index:50;background:rgba(7,9,13,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid #222c3b;font:600 14px/1 Inter,system-ui,sans-serif">'
                      '<div style="max-width:1180px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;overflow-x:auto;gap:2px;scrollbar-width:none">'
                      f'<a href="{home}" style="color:#e8edf4;text-decoration:none;font:800 18px/1 Fraunces,Georgia,serif;padding:6px 14px 6px 6px;white-space:nowrap">QualiCX <span style="color:#8b5cf6">Brasil</span></a>{a}</div></nav><!--/qcx-nav-->')

          def injeta(p, prefix=''):
              t = p.read_text()
              t = re.sub(r'<!--qcx-nav-->.*?<!--/qcx-nav-->', '', t, flags=re.S)
              t = re.sub(r'(<body[^>]*>)', lambda m: m.group(1) + nav(prefix), t, count=1)
              p.write_text(t)

          # ---------------- Arte generativa ----------------
          CATS = [  # nome, regex, cores (fundo1, fundo2, destaque)
              ('Regulação e SAC', r'\b(SAC|decreto|procon|senacon|regras?|lei|consumidor\.gov|regula\w*|anatel|bacen|ans)\b', ('#1e1b4b', '#5b21b6', '#f59e0b')),
              ('IA e tecnologia', r'\b(IA|AI|intelig[eê]ncia artificial|chatbots?|bots?|automa\w*|agentes?|plataformas?|digital|voz|dados|cloud|dynamics)\b', ('#042f2e', '#0e7490', '#a78bfa')),
              ('Contact Center', r'(contact center|call center|central de atendimento|BPO|teleatendimento)', ('#0b1d3a', '#1d4ed8', '#22d3ee')),
              ('Varejo e e-commerce', r'(varejo|e-?commerce|black friday|loja|compra|marketplace)', ('#3b0a1f', '#9d174d', '#fbbf24')),
              ('Experiência do cliente', r'.', ('#111827', '#6d28d9', '#22d3ee')),
          ]
          def categoria(t):
              for nome, rx, cores in CATS:
                  if re.search(rx, t, re.I): return nome, cores
              return CATS[-1][0], CATS[-1][2]

          def arte(seed, cores, w=640, h=360, rotulo=''):
              hx = hashlib.md5(seed.encode()).hexdigest()
              r = random.Random(hx)
              c1, c2, ac = cores
              uid = 'g' + hx[:8] + str(w)
              ang = r.randint(0, 360)
              p = [f'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {w} {h}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ilustração abstrata{(": " + E(rotulo)) if rotulo else ""}">',
                   f'<defs><linearGradient id="{uid}a" gradientTransform="rotate({ang} .5 .5)"><stop offset="0" stop-color="{c1}"/><stop offset="1" stop-color="{c2}"/></linearGradient>',
                   f'<radialGradient id="{uid}b"><stop offset="0" stop-color="{ac}" stop-opacity=".8"/><stop offset="1" stop-color="{ac}" stop-opacity="0"/></radialGradient>',
                   f'<pattern id="{uid}d" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#fff" fill-opacity=".13"/></pattern></defs>',
                   f'<rect width="{w}" height="{h}" fill="url(#{uid}a)"/>']
              gx, gy = r.uniform(.2, .9) * w, r.uniform(.1, .6) * h
              p.append(f'<circle cx="{gx:.0f}" cy="{gy:.0f}" r="{r.uniform(.35,.6)*max(w,h):.0f}" fill="url(#{uid}b)" opacity=".5"/>')
              estilo = r.randint(0, 2)
              s = min(w, h) / 360
              if estilo == 0:   # aneis concentricos (sinal, voz)
                  cx, cy = r.uniform(.55, .85) * w, r.uniform(.3, .65) * h
                  for i in range(r.randint(5, 9)):
                      p.append(f'<circle cx="{cx:.0f}" cy="{cy:.0f}" r="{(22 + i*r.uniform(20,30))*s:.0f}" fill="none" stroke="{ac if i==2 else "#fff"}" stroke-opacity="{.8 if i==2 else max(.06,.34 - i*.035):.2f}" stroke-width="{(2.5 if i==2 else 1.4)*s:.1f}"/>')
              elif estilo == 1:  # ondas (jornada)
                  n = r.randint(4, 7)
                  for i in range(n):
                      y0 = h * (.3 + i * .1); a = r.uniform(16, 42) * s; seg = r.randint(3, 5); step = w / seg
                      d = f'M0 {y0:.0f} ' + ' '.join(f'Q {step*k + step/2:.0f} {y0 + (a if k%2==0 else -a):.0f} {step*(k+1):.0f} {y0:.0f}' for k in range(seg))
                      p.append(f'<path d="{d}" fill="none" stroke="{ac if i==1 else "#fff"}" stroke-opacity="{.85 if i==1 else .18}" stroke-width="{(3 if i==1 else 1.4)*s:.1f}"/>')
              else:              # barras (dados)
                  n = r.randint(9, 14); x0 = w * .4; bw = (w * .55) / n; base = h * .84; hi = r.randint(n-5, n-2)
                  for i in range(n):
                      bh = h * r.uniform(.12, .55) * (1 + i / n * .5)
                      p.append(f'<rect x="{x0 + i*bw:.0f}" y="{base-bh:.0f}" width="{bw*.6:.0f}" height="{bh:.0f}" rx="{3*s:.0f}" fill="{ac if i==hi else "#fff"}" fill-opacity="{.9 if i==hi else .15}"/>')
                  p.append(f'<line x1="{x0-10:.0f}" y1="{base:.0f}" x2="{w*.97:.0f}" y2="{base:.0f}" stroke="#fff" stroke-opacity=".3"/>')
              p.append(f'<rect width="{w}" height="{h}" fill="url(#{uid}d)"/>')
              for _ in range(r.randint(3, 6)):
                  p.append(f'<circle cx="{r.uniform(0,w):.0f}" cy="{r.uniform(0,h):.0f}" r="{r.uniform(2,5)*s:.1f}" fill="{ac}" fill-opacity=".9"/>')
              p.append('</svg>')
              return ''.join(p)

          # ---------------- Estrutura de pagina ----------------
          LD_SITE = ''
          m = re.search(r'<script type="application/ld\+json">.*?</script>', (B/'index.html').read_text(), re.S)
          if m and '"WebSite"' in m.group(0): LD_SITE = m.group(0)

          def pagina(arq, titulo, desc, corpo, tipo='WebPage', ld=None, titulo_tag=None):
              ldj = ld or ('<script type="application/ld+json">' + json.dumps({'@context': 'https://schema.org', '@type': tipo, 'name': titulo, 'url': SITE + arq, 'inLanguage': 'pt-BR',
                           'isPartOf': {'@id': SITE + '#site'}, 'publisher': {'@id': 'https://orcid.org/0009-0000-1747-1392'}}, ensure_ascii=False) + '</script>')
              rodape = ''.join(f'<a href="{h or "./"}">{t}</a>' for h, t in LINKS)
              (B/(arq or 'index.html')).write_text(f'''<!DOCTYPE html>
          <html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
          <title>{E(titulo_tag or (titulo + " | QualiCX Brasil"))}</title>
          <meta name="description" content="{E(desc)}">
          <meta name="author" content="André Luiz Maciel">
          <link rel="canonical" href="{SITE}{arq}">
          <meta name="theme-color" content="#07090d">
          <meta property="og:type" content="website"><meta property="og:site_name" content="QualiCX Brasil"><meta property="og:title" content="{E(titulo)}"><meta property="og:description" content="{E(desc)}"><meta property="og:url" content="{SITE}{arq}"><meta property="og:image" content="{SITE}img/og-qualicx.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="{SITE}img/og-qualicx.png">
          {ldj}
          {FONTS}
          <link rel="stylesheet" href="assets/qcx.css">
          </head><body>
          <main>
          {corpo}
          </main>
          <footer><div class="wrap"><div class="brand">QualiCX <span>Brasil</span></div>
          <p>Revista independente de Qualidade, Customer Experience e Contact Center.</p>
          <nav>{rodape}</nav>
          <p>Editor: <a href="autor.html">André Luiz Maciel</a> · ORCID <a href="https://orcid.org/0009-0000-1747-1392">0009-0000-1747-1392</a> · Textos sob licença CC BY 4.0, salvo indicação. Manchetes de terceiros pertencem aos respectivos veículos; as ilustrações são artes abstratas geradas pelo QualiCX Brasil.</p></div></footer>
          </body></html>
          ''')

          # ---------------- Dados ----------------
          N = json.loads((B/'data'/'noticias.json').read_text()) if (B/'data'/'noticias.json').exists() else {'atualizado': '', 'itens': []}
          IT = N['itens']
          for i in IT:
              i['cat'], i['cores'] = categoria(i['titulo'])
          atual = datetime.date.fromisoformat(N['atualizado']).strftime('%d/%m/%Y') if N['atualizado'] else '—'
          def dbr(s): return datetime.date.fromisoformat(s).strftime('%d/%m/%Y')
          def ext(i): return f'href="{E(i["link"])}" target="_blank" rel="noopener nofollow"'

          def ncard(i):
              return (f'<a class="ncard" data-cat="{E(i["cat"])}" {ext(i)}><div class="art">{arte(i["titulo"], i["cores"], rotulo=i["cat"])}<span class="chip">{E(i["cat"])}</span></div>'
                      f'<div class="body"><h3>{E(i["titulo"])}</h3><span class="meta">{E(i["fonte"])} · {dbr(i["data"])}</span></div></a>')

          ART = [('artigos/expertise360-atendimento-protagonista.html', 'Expertise360: o que o atendimento protagonista ensina à área de Qualidade', 'Cobertura da palestra Atendimento Protagonista, de Gisele Paula, no evento da CSH.', '14/11/2026', '', ('#0b1d3a', '#1d4ed8', '#38bdf8')),
                 ('artigos/reclame-aqui-armadilha.html', 'O Reclame Aqui é uma armadilha para as empresas?', 'Reputação pública, resolução no primeiro contato e experiência do cliente.', '06/11/2026', '10.5281/zenodo.24025962', ('#3b0a1f', '#7c3aed', '#f59e0b')),
                 ('artigos/nao-so-de-call-center.html', 'Não Só de Call Center Vive a Experiência do Cliente', 'Qualidade estratégica, Voz do Cliente e análise de dados para transformar jornadas em resultados.', '28/04/2026', '10.5281/zenodo.23898804', ('#0b1d3a', '#1d4ed8', '#22d3ee')),
