          pagina('publique.html', 'Publique seu artigo no QualiCX Brasil',
                 'Envie seu artigo sobre Customer Experience, Qualidade, SAC ou Contact Center para avaliação editorial do QualiCX Brasil.',
                 f'''<div class="wrap narrow"><header style="padding:36px 0 0"><span class="kicker">Colabore</span><h1>Publique seu artigo</h1>
          <p class="lead">O QualiCX Brasil recebe artigos de profissionais, pesquisadores e líderes de Customer Experience, Qualidade, SAC e Contact Center. Toda proposta passa por avaliação editorial antes da publicação.</p></header>
          <div class="hero-art">{arte("publique-hero", PUB_CORES, 1200, 400, "colabore")}</div>
          <div class="cols3">
          <div class="box"><h3>O que publicamos</h3><p class="meta">Artigos técnicos, estudos de caso e análises com dados sobre CX, Qualidade, Voz do Cliente, indicadores, tecnologia e gestão de operações. Inéditos ou com republicação autorizada, de 800 a 2.500 palavras, em português.</p></div>
          <div class="box"><h3>Critérios editoriais</h3><p class="meta">Números com fonte, contexto e limitações. Opinião, experiência, hipótese e resultado medido claramente separados. Sem publicidade disfarçada nem plágio.</p></div>
          <div class="box"><h3>Direitos</h3><p class="meta">O autor mantém os direitos do texto; a publicação no site segue a licença CC BY 4.0, salvo combinação diferente. Sem dados de clientes ou empresas sem autorização.</p></div>
          </div>
          <h2 class="sec">Como enviar</h2>
          <ol class="steps">
          <li>Prepare título, resumo de até 200 palavras e o texto completo num link (Google Docs, PDF ou similar).</li>
          <li>Preencha o formulário de submissão.</li>
