                  if 'og:image' not in _t:
                      _t = _t.replace('</head>', f'<meta property="og:image" content="{SITE}{_img}"><meta property="og:type" content="article">\n</head>', 1)
                  if 'twitter:card' not in _t:
                      _t = _t.replace('</head>', '<meta name="twitter:card" content="summary_large_image">\n</head>', 1)
                  _p.write_text(_t)

          # ---------------- Navegação nas demais páginas ----------------
          for p in list(B.glob('*.html')):
              if not p.name.startswith('google'): injeta(p)
          for p in B.glob('artigos/*.html'): injeta(p, '../')

